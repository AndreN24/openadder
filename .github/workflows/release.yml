name: Release

# Push a tag such as v1.0.0 to build OpenAdder and publish it on the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # only this job can create the release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $version = (python -c "import openadder; print(openadder.__version__)").Trim()
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match openadder.__version__ ($version)" }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run the tests
        env:
          CI: "1"
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -t .

      - name: Build the app
        shell: cmd
        run: build.bat

      - name: Make the portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\OpenAdder -DestinationPath "dist\OpenAdder-$env:VERSION-portable.zip"

      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$env:VERSION" installer\OpenAdder.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG `
            "dist\OpenAdder-$env:VERSION-Setup.exe" `
            "dist\OpenAdder-$env:VERSION-portable.zip" `
            --title "OpenAdder $env:VERSION" --notes-file CHANGELOG.md
